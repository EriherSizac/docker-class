server {
    listen 80;
    server_name _;

    # nginx reenvía todo el tráfico al servicio "api" (resuelto por nombre
    # dentro de la red privada de Compose) en su puerto interno 3000.
    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
